name: firmeza-final
services:
  # ====================================================================
  # Backend API (.NET 10)
  # ====================================================================
  api:
    build:
      context: .
      dockerfile: src/Firmeza.Api/Dockerfile
    ports:
      - "${API_PORT:-8081}:5134"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST:-postgres-local};Port=${DB_PORT:-5432};Database=${DB_NAME:-firmeza};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-Lastre098707}
    restart: unless-stopped

  # ====================================================================
  # Frontend & Web Host (Angular + ASP.NET Core)
  # ====================================================================
  web:
    build:
      context: .
      dockerfile: src/Firmeza.Web/Dockerfile
    ports:
      - "5104:5099"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - api
    restart: unless-stopped

  # ====================================================================
  # (Opcional) Base de Datos PostgreSQL local en Docker
  # Solo se inicia si ejecutas: docker compose --profile local-db up
  # ====================================================================
  postgres-local:
    image: postgres:16-alpine
    profiles: ["local-db"]
    ports:
      - "5438:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-firmeza}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-Lastre098707}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-firmeza}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: